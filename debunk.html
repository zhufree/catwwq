<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辟谣 - 辟谣平台</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 配置Tailwind的暗黑模式
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {}
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-gray-100 dark:bg-gray-900 transition-colors duration-300">
  <!-- 头部组件将通过JS加载 -->
  <header id="header-container"></header>
  
  <!-- 主要内容区域 -->
  <main class="container mx-auto px-4 py-8 max-w-6xl">
      <h1 class="text-3xl font-bold text-center text-gray-800 dark:text-white mb-8">辟谣及剧情解析</h1>
      
      <!-- 离人泪剧情板块 -->
      <section class="mb-12">
        <h2 class="text-2xl font-semibold text-gray-700 dark:text-gray-300 mb-6 pb-2 border-b border-gray-300 dark:border-gray-600">离人泪剧情</h2>
        <div id="game-of-interests-container"></div>
        <div id="why-take-liquor-container"></div>
        <div id="what-did-liquor-get-container"></div>
      </section>

      <!-- 唐钱令板块 -->
      <section class="mb-12">
        <h2 class="text-2xl font-semibold text-gray-700 dark:text-gray-300 mb-6 pb-2 border-b border-gray-300 dark:border-gray-600">唐钱令</h2>
        <!-- 唐钱令相关组件容器 -->
        <p class="text-gray-600 dark:text-gray-400">[唐钱令相关内容将在此处添加]</p>
      </section>

      <!-- 樊楼板块 -->
      <section class="mb-12">
        <h2 class="text-2xl font-semibold text-gray-700 dark:text-gray-300 mb-6 pb-2 border-b border-gray-300 dark:border-gray-600">樊楼</h2>
        <!-- 樊楼相关组件容器 -->
        <div id="figure-zhangcuo-and-gay-container"></div>
      </section>
      
      <!-- 此处可添加更多辟谣内容 -->
  </main>
  
  <!-- 底部组件将通过JS加载 -->
  <footer id="footer-container"></footer>
  
  <!-- 暗黑模式切换脚本 -->
  <script src="js/darkMode.js" type="module"></script>
  <!-- 组件加载脚本 -->
  <script src="js/main.js" type="module"></script>
</body>
</html>
