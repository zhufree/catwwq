<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辟谣 - 辟谣平台</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 配置Tailwind的暗黑模式
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {}
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-gray-100 dark:bg-gray-900 transition-colors duration-300">
  <!-- 头部组件将通过JS加载 -->
  <header id="header-container"></header>
  
  <!-- 主要内容区域 -->
  <main class="container mx-auto px-4 py-8 max-w-6xl">
      <h1 class="text-3xl font-bold text-center text-gray-800 dark:text-white mb-8">辟谣及剧情解析</h1>
      
      <!-- 辟谣内容区域 -->
      <div id="yiyepingsheng-container"></div>
      <div id="wwq-aim-container"></div>
      <div id="game-of-interests-container"></div>
      <div id="why-take-liquor-container"></div>
      
      <!-- 此处可添加更多辟谣内容 -->
  </main>
  
  <!-- 底部组件将通过JS加载 -->
  <footer id="footer-container"></footer>
  
  <!-- 暗黑模式切换脚本 -->
  <script src="js/darkMode.js" type="module"></script>
  <!-- 组件加载脚本 -->
  <script src="js/main.js" type="module"></script>
</body>
</html>
