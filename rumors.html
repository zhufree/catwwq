<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>谣言 - 辟谣平台</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 配置Tailwind的暗黑模式
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {}
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Tab样式 */
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-100 dark:bg-gray-900 transition-colors duration-300">
    <!-- 头部组件将通过JS加载 -->
    <header id="header-container"></header>
    
    <!-- 主要内容区域 -->
    <main class="container mx-auto px-4 py-8">
        <!-- Tab导航 -->
        <div class="flex border-b border-gray-300 dark:border-gray-700 mb-6">
            <button id="tab1-btn" class="px-6 py-3 font-medium text-gray-800 dark:text-white border-b-2 border-blue-500 tab-btn active">
                第一页
            </button>
            <button id="tab2-btn" class="px-6 py-3 font-medium text-gray-600 dark:text-gray-400 hover:text-gray-800 dark:hover:text-white tab-btn">
                第二页
            </button>
        </div>
        
        <!-- Tab内容 -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6">
            <!-- 第一个Tab内容 -->
            <div id="tab1-content" class="tab-content active">
                <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-4">谣言1</h2>
                <!-- 此处留空 -->
            </div>
            
            <!-- 第二个Tab内容 -->
            <div id="tab2-content" class="tab-content">
                <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-4">谣言2</h2>
                <!-- 此处留空 -->
            </div>
        </div>
    </main>
    
    <!-- 底部组件将通过JS加载 -->
    <footer id="footer-container"></footer>
    
    <!-- 暗黑模式切换脚本 -->
    <script src="js/darkMode.js" type="module"></script>
    <!-- 组件加载脚本 -->
    <script src="js/main.js" type="module"></script>
    <!-- Tab切换脚本 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const tabBtns = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');
            
            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // 移除所有按钮的活跃状态
                    tabBtns.forEach(b => {
                        b.classList.remove('border-blue-500');
                        b.classList.remove('text-gray-800', 'dark:text-white');
                        b.classList.add('text-gray-600', 'dark:text-gray-400');
                    });
                    
                    // 添加当前按钮的活跃状态
                    btn.classList.add('border-blue-500');
                    btn.classList.add('text-gray-800', 'dark:text-white');
                    btn.classList.remove('text-gray-600', 'dark:text-gray-400');
                    
                    // 隐藏所有内容
                    tabContents.forEach(content => {
                        content.classList.remove('active');
                    });
                    
                    // 显示对应的内容
                    const tabId = btn.id.replace('-btn', '-content');
                    document.getElementById(tabId).classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
